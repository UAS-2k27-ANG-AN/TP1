@if (product) {
  <div class="detail">
    <div class="detail-icon" aria-hidden="true">✳</div>
    <div class="detail-copy">
      <p class="detail-label">VOTRE SÉLECTION</p>
      <h2>{{ product.name }}</h2>
      <p class="description">{{ product.description }}</p>
    </div>
    <p class="detail-price">{{ product.price | currency:'EUR':'symbol':'1.2-2':'fr-FR' }}</p>
  </div>
} @else {
  <p class="detail-placeholder">Sélectionnez un produit pour en découvrir les détails.</p>
}
